machine:
  install:
    # iscsi-tools / util-linux-tools(Longhorn)、gvisor、qemu-guest-agent を含む Image Factory のイメージ
    image: factory.talos.dev/installer/c527b6b20fb22847304656677e9bd4c4055dfcce95f3385da5db80e35f5fa1dc:v1.13.2
  kubelet:
    extraMounts:
      # Longhorn のデータ置き場。kubelet から rshared で見えるようにする
      - destination: /var/lib/longhorn
        type: bind
        source: /var/lib/longhorn
        options: [bind, rshared, rw]
  files:
    # gVisor(runsc)を containerd のランタイムとして登録する。RuntimeClass "gvisor" から使う
    - path: /etc/cri/conf.d/20-customization.part
      op: create
      permissions: 0o644
      content: |
        [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.runsc]
          runtime_type = "io.containerd.runsc.v1"
