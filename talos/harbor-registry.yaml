machine:
  network:
    extraHostEntries:
      # ノードの containerd はクラスタ DNS を使えないため、Harbor の ClusterIP を名前に固定する
      - ip: 10.110.181.55
        aliases: [harbor.main-harbor]
  registries:
    config:
      harbor.main-harbor:
        tls:
          ca:    # Harbor の CA(有効期間 100 年。2126-09-21 まで)の base64 PEM を信頼する。検証は有効のまま
